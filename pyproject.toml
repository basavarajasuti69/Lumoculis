[project]
name = "lumoculis"
version = "0.1.0"
description = "Lumoculis: AI-assisted diabetic retinopathy screening support."
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "Pillow>=10",
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "mlflow>=2.5",
    "matplotlib>=3.7",
    "fastapi>=0.100",
    "pydantic>=2.5",
    "onnx>=1.15",
    "onnxruntime>=1.16",
    "gradio>=4.0",
    "kaggle>=2.2.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling>=1.14"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "DTZ", "G", "PL", "RUF", "S"]
ignore = ["B008", "E501", "S101"]

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.pytest.ini_options]
pythonpath = ["src"]
